[libdefaults]
    default_realm = CDP.LOCAL
    dns_lookup_realm = false
    dns_lookup_kdc = false
    # k8s reverse DNS is inconsistent; use names exactly as configured.
    rdns = false
    dns_canonicalize_hostname = false
    # TCP only: friendlier to Java and to k8s networking than UDP.
    udp_preference_limit = 1
    ticket_lifetime = 24h
    renew_lifetime = 7d
    forwardable = true
    # Java can't read keyring caches; FILE is also where Java looks by default.
    default_ccache_name = FILE:/tmp/krb5cc_%{uid}
    default_tgs_enctypes = aes256-cts-hmac-sha1-96 aes128-cts-hmac-sha1-96
    default_tkt_enctypes = aes256-cts-hmac-sha1-96 aes128-cts-hmac-sha1-96
    permitted_enctypes = aes256-cts-hmac-sha1-96 aes128-cts-hmac-sha1-96

[realms]
    CDP.LOCAL = {
        kdc = @EDGE_FQDN@
    }

[domain_realm]
    @EDGE_FQDN@ = CDP.LOCAL

[logging]
    kdc = FILE:/var/log/krb5kdc.log
