# Headless Service so hadoop-edge.es-tenant-2.svc.cluster.local resolves
# directly to the edge pod IP (no kube-proxy hairpin), exposing HDFS NameNode
# RPC + DataNode + NameNode HTTP. This FQDN is what the image bakes into
# fs.defaultFS for the es-tenant-2 build, so the DataNode advertises a routable,
# in-namespace address.
apiVersion: v1
kind: Service
metadata:
  name: hadoop-edge
  namespace: es-tenant-2
spec:
  clusterIP: None
  selector:
    app: hadoop-edge
  ports:
    - { name: namenode-rpc, port: 9000, targetPort: 9000 }
    - { name: datanode, port: 50010, targetPort: 50010 }
    - { name: namenode-http, port: 9870, targetPort: 9870 }
